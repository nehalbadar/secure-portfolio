        // Blog posts data

            {

                excerpt: "Exploring the latest trends in JavaScript development, from ES6+ features to modern frameworks and best practices for building maintainable code.",

            {
                id: 2,
                title: "The Future of AI in Software Development",
                excerpt: "How artificial intelligence is transforming the way we write code, from code completion tools to automated testing and deployment pipelines.",
                date: "2024-01-10",
                readTime: "6 min read",
                tags: ["AI", "Machine Learning", "DevOps"],
                image: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=250&fit=crop"
            },
            {
                id: 3,
                title: "Mastering CSS Grid and Flexbox",
                excerpt: "A comprehensive guide to modern CSS layout techniques, with practical examples and real-world use cases for creating responsive designs.",
                date: "2024-01-05",
                readTime: "10 min read",
                tags: ["CSS", "Responsive Design", "Frontend"],
                image: "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=400&h=250&fit=crop"
            },
            {
                id: 4,
                title: "Node.js Best Practices for Production Applications",
                excerpt: "Essential tips and techniques for building robust, scalable Node.js applications that can handle real-world traffic and edge cases.",
                date: "2023-12-28",
                readTime: "12 min read",
                tags: ["Node.js", "Backend", "Performance"],
                image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=400&h=250&fit=crop"
            },
            {
                id: 5,
                title: "Version Control Strategies with Git",
                excerpt: "Advanced Git workflows, branching strategies, and collaboration techniques for efficient team development and code management.",
                date: "2023-12-20",
                readTime: "7 min read",
                tags: ["Git", "Version Control", "Collaboration"],
                image: "https://images.unsplash.com/photo-1556075798-4825dfaaf498?w=400&h=250&fit=crop"
            },
            {
                id: 6,
                title: "Securing Your Web Applications",
                excerpt: "Comprehensive security practices for web developers, covering common vulnerabilities, authentication, and data protection strategies.",
                date: "2023-12-15",
                readTime: "9 min read",
                tags: ["Security", "Web Development", "Authentication"],
                image: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=400&h=250&fit=crop"
            }
        ];

        // Load blog posts
        function loadBlogPosts() {
            const container = document.getElementById('blog-container');

            // Show skeleton loading
            container.innerHTML = `
                <article class="blog-card skeleton-card">
                    <div class="blog-image">
                        <div class="skeleton" style="width: 100%; height: 200px;"></div>
                    </div>
                    <div class="blog-content">
                        <div class="skeleton skeleton-text" style="width: 30%; height: 1em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 80%; height: 1.5em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 1em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 60%; height: 1em; margin-bottom: 1em;"></div>
                        <div class="skeleton" style="width: 100px; height: 2em;"></div>
                    </div>
                </article>
                <article class="blog-card skeleton-card">
                    <div class="blog-image">
                        <div class="skeleton" style="width: 100%; height: 200px;"></div>
                    </div>
                    <div class="blog-content">
                        <div class="skeleton skeleton-text" style="width: 30%; height: 1em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 80%; height: 1.5em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 100%; height: 1em; margin-bottom: 0.5em;"></div>
                        <div class="skeleton skeleton-text" style="width: 60%; height: 1em; margin-bottom: 1em;"></div>
                        <div class="skeleton" style="width: 100px; height: 2em;"></div>
                    </div>
                </article>
            `;

            // Simulate loading delay for demo
            setTimeout(() => {
                container.innerHTML = '';

                blogPosts.forEach(post => {
                    const postElement = document.createElement('article');
                    postElement.className = 'blog-card';
                    postElement.innerHTML = `
                        <div class="blog-image">
                            <img src="${post.image}" alt="${post.title}" loading="lazy">
                        </div>
                        <div class="blog-content">
                            <div class="blog-meta">
                                <span class="blog-date">${formatDate(post.date)}</span>
                                <span class="blog-read-time">${post.readTime}</span>
                            </div>
                            <h3 class="blog-title">${post.title}</h3>
                            <p class="blog-excerpt">${post.excerpt}</p>
                            <div class="blog-tags">
                                ${post.tags.map(tag => `<span class="blog-tag">${tag}</span>`).join('')}
                            </div>
                            <a href="#" class="blog-link">Read More →</a>
                        </div>
                    `;
                    container.appendChild(postElement);
                });
            }, 1000);
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Load blog posts when page loads
        document.addEventListener('DOMContentLoaded', loadBlogPosts);
    </script>
