<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weather Forecast Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <h1>Weather Forecast</h1>
          <p class="tag">Fast, clean 7‑day forecasts • Geolocation • Modern UI</p>
        </div>
        <div class="search-row">
          <form id="searchForm" class="search-form">
            <input id="cityInput" placeholder="Enter city (e.g., London)" aria-label="City name" />
            <button type="submit" class="btn">Search</button>
          </form>
          <div style="display:flex;gap:.5rem;align-items:center">
            <button type="button" id="locBtn" class="btn outline">Use my location</button>
            <div class="unit-toggle">
              <label class="switch">
                <input id="unitToggle" type="checkbox">
                <span class="slider"></span>
              </label>
              <span id="unitLabel">°C</span>
            </div>
          </div>
        </div>
      </header>

      <div id="error" class="error" role="status"></div>

      <div id="loader" class="loader hidden">Loading…</div>

      <section id="result" class="hidden">
        <h2 id="locName"></h2>
        <div id="current"></div>
        <h3>7-day forecast</h3>
        <ul id="daily" class="grid"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
